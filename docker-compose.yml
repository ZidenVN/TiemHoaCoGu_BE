services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoasap_backend
    restart: unless-stopped
    ports:
      - "5012:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Database__Provider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/hoasap.db
      - Database__Initialize=true
      - Database__Seed=true
    volumes:
      - backend_data:/app/data
      - backend_media:/app/App_Data/media
    networks:
      - hoasap_net

  frontend:
    build:
      context: ../TiemHoaCoGu
      dockerfile: Dockerfile
    container_name: hoasap_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://backend:8080
      - STOREFRONT_WRITES_ENABLED=true
      - SITE_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - hoasap_net

volumes:
  backend_data:
  backend_media:

networks:
  hoasap_net:
    driver: bridge
